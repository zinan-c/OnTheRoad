name: "CI: Quality Related"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "CI: Quality Related / ${{ matrix.task }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, unit, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.task == 'unit'
        name: Install pinned native MinIO test tools
        run: |
          bash scripts/install-native-minio.sh "$RUNNER_TEMP/otr-native-minio"
          echo "$RUNNER_TEMP/otr-native-minio" >> "$GITHUB_PATH"
      - if: matrix.task == 'unit'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.task == 'unit'
        name: Install Linux test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick poppler-utils
      - run: pnpm run ${{ matrix.task }}

  clean-install:
    name: "CI: Quality Related / clean-install"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned native MinIO test tools
        run: |
          bash scripts/install-native-minio.sh "$RUNNER_TEMP/otr-native-minio"
          echo "$RUNNER_TEMP/otr-native-minio" >> "$GITHUB_PATH"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install Linux test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick poppler-utils
      - run: pnpm run quality
      - run: pnpm run ci:smoke
      - run: git diff --exit-code
