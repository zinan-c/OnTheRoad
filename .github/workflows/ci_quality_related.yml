name: "CI-Quality Related"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "CI-Quality Related / ${{ matrix.task }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, unit, build]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.task == 'unit'
        name: Install pinned native MinIO test tools
        run: |
          bash scripts/install-native-minio.sh "$RUNNER_TEMP/otr-native-minio"
          echo "$RUNNER_TEMP/otr-native-minio" >> "$GITHUB_PATH"
      - if: matrix.task == 'unit'
        name: Install Chromium with bounded retries
        timeout-minutes: 12
        run: bash scripts/install-ci-chromium.sh
      - if: matrix.task == 'unit'
        name: Install Linux test tools
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends --yes imagemagick poppler-utils
      - run: pnpm run ${{ matrix.task }}

  clean-install:
    name: "CI-Quality Related / clean-install"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned native MinIO test tools
        run: |
          bash scripts/install-native-minio.sh "$RUNNER_TEMP/otr-native-minio"
          echo "$RUNNER_TEMP/otr-native-minio" >> "$GITHUB_PATH"
      - name: Install Chromium with bounded retries
        timeout-minutes: 12
        run: bash scripts/install-ci-chromium.sh
      - name: Install Linux test tools
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends --yes imagemagick poppler-utils
      - run: pnpm run quality
      - run: pnpm run ci:smoke
      - run: git diff --exit-code
