name: "CI-Test Cases"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cases:
    name: "CI-Test Cases"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OTR_E2E_MODE: "1"
      OTR_E2E_WRITE_TOKEN: e2e-ci-write-token-change-per-run-123456
      OTR_E2E_USERNAME: e2e_playwright
      OTR_E2E_PASSWORD: E2e_Playwright_1234!
      OTR_BOOTSTRAP_ADMIN_USERNAME: e2e_playwright
      OTR_BOOTSTRAP_ADMIN_PASSWORD: E2e_Playwright_1234!
      OTR_BOOTSTRAP_ADMIN_FORCE_PASSWORD_CHANGE: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned native MinIO test tools
        run: |
          bash scripts/install-native-minio.sh "$RUNNER_TEMP/otr-native-minio"
          echo "$RUNNER_TEMP/otr-native-minio" >> "$GITHUB_PATH"
      - name: Install Chromium system dependencies
        timeout-minutes: 8
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium browser with bounded retries
        timeout-minutes: 12
        run: bash scripts/install-ci-chromium.sh
      - name: Install Linux test tools
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends --yes imagemagick poppler-utils redis-tools
      - name: Initialize required-case diagnostic artifact
        env:
          OTR_REQUIRED_CASE_REPORT: test-results/m0-m4-required.json
        run: node scripts/initialize-required-case-report.mjs
      - name: Configure disposable E2E database
        run: |
          if [ ! -f infra/local-stack.env ]; then
            install -m 600 infra/local-stack.env.example infra/local-stack.env
          fi
          e2e_database="on_the_road_e2e_${GITHUB_RUN_ID}"
          sed -i "s/^POSTGRES_DB=.*/POSTGRES_DB=${e2e_database}/" infra/local-stack.env
          sed -i -E "s#^(DATABASE_URL=postgresql://[^/]+/).*#\\1${e2e_database}#" infra/local-stack.env
      - name: Start real integration dependencies
        run: |
          bash scripts/dev-up.sh --track compose
          echo "Compose dependencies ready"
      - name: Apply and verify the unified database schema
        run: |
          set -a
          source infra/local-stack.env
          set +a
          pnpm run db:migrate
          pnpm run db:seed
          pnpm run db:status -- --check --json
          OTR_DATABASE_MIGRATION_TEST_URL="$DATABASE_URL" \
            pnpm --filter @on-the-road/database exec vitest run \
              test/migration-runner.spec.ts test/migration-runner.integration.spec.ts
      - name: Run every required M0-M4 case without skips
        env:
          OTR_RUN_CLAMAV_INTEGRATION: "1"
          OTR_REQUIRED_CASE_REPORT: test-results/m0-m4-required.json
        run: |
          set -a
          source infra/local-stack.env
          set +a
          : "${DATABASE_URL:?infra/local-stack.env must define DATABASE_URL}"
          : "${REDIS_URL:?infra/local-stack.env must define REDIS_URL}"
          export OTR_TRIP_DATABASE_URL="$DATABASE_URL"
          export OTR_M1_DATABASE_URL="$DATABASE_URL"
          export OTR_M1_REDIS_URL="$REDIS_URL"
          export OTR_B05_DATABASE_URL="$DATABASE_URL"
          export OTR_B07_DATABASE_URL="$DATABASE_URL"
          export OTR_C03_DATABASE_URL="$DATABASE_URL"
          export OTR_D01_DATABASE_URL="$DATABASE_URL"
          export OTR_D02_DATABASE_URL="$DATABASE_URL"
          export OTR_D04_DATABASE_URL="$DATABASE_URL"
          export OTR_E02_DATABASE_URL="$DATABASE_URL"
          export OTR_C07_DATABASE_URL="$DATABASE_URL"
          export OTR_E04_DATABASE_URL="$DATABASE_URL"
          export OTR_M3_DATABASE_URL="$DATABASE_URL"
          export OTR_SCHEMA_IMMUTABILITY_DATABASE_URL="$DATABASE_URL"
          mkdir -p test-results
          pnpm exec turbo run build \
            --filter=@on-the-road/api \
            --filter=@on-the-road/worker \
            --filter=@on-the-road/pdf-worker
          pnpm run profile:dev -- pnpm --filter @on-the-road/api start \
            > test-results/m4-api.log 2>&1 &
          api_pid=$!
          pnpm run profile:dev -- pnpm --filter @on-the-road/worker start \
            > test-results/m4-worker.log 2>&1 &
          worker_pid=$!
          pnpm run profile:dev -- pnpm --filter @on-the-road/pdf-worker start \
            > test-results/m4-pdf-worker.log 2>&1 &
          pdf_worker_pid=$!
          api_origin="$(bash scripts/run-profile.sh dev -- node -e \
            'process.stdout.write(new URL(process.env.API_BASE_URL).origin)')"
          web_origin="$(bash scripts/run-profile.sh dev -- node -e \
            'process.stdout.write(new URL(process.env.APP_ORIGIN).origin)')"
          export NEXT_PUBLIC_API_ORIGIN="$api_origin"
          export OTR_PLAYWRIGHT_API_ORIGIN="$api_origin"
          export OTR_PLAYWRIGHT_WEB_ORIGIN="$web_origin"
          cleanup_runtimes() {
            kill "$api_pid" "$worker_pid" "$pdf_worker_pid" 2>/dev/null || true
          }
          print_runtime_diagnostics() {
            echo "Application runtime readiness response:"
            cat test-results/m4-readiness.json 2>/dev/null || true
            echo "API runtime log:"
            cat test-results/m4-api.log 2>/dev/null || true
            echo "Worker runtime log:"
            cat test-results/m4-worker.log 2>/dev/null || true
            echo "PDF Worker runtime log:"
            cat test-results/m4-pdf-worker.log 2>/dev/null || true
            echo "Compose dependency health:"
            bash scripts/dev-up-health.sh --track compose || true
          }
          fail_if_runtime_exited() {
            runtime_name="$1"
            runtime_pid="$2"
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              runtime_status=0
              wait "$runtime_pid" || runtime_status=$?
              echo "$runtime_name application runtime exited before readiness (status $runtime_status)." >&2
              print_runtime_diagnostics
              exit 1
            fi
          }
          trap cleanup_runtimes EXIT
          for attempt in $(seq 1 60); do
            fail_if_runtime_exited "API" "$api_pid"
            fail_if_runtime_exited "Worker" "$worker_pid"
            fail_if_runtime_exited "PDF Worker" "$pdf_worker_pid"
            curl --silent "$api_origin/health/ready" \
              > test-results/m4-readiness.json || true
            if grep --quiet '"status":"ready"' test-results/m4-readiness.json; then
              fail_if_runtime_exited "API" "$api_pid"
              fail_if_runtime_exited "Worker" "$worker_pid"
              fail_if_runtime_exited "PDF Worker" "$pdf_worker_pid"
              if redis-cli -u "$REDIS_URL" --scan --pattern 'otr:pdf-worker:heartbeat:*' 2>/dev/null | grep --quiet .; then
                echo "Application runtimes ready: API, Worker, and PDF Worker heartbeat passed"
                break
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Application runtime readiness timed out at $api_origin." >&2
              print_runtime_diagnostics
              exit 1
            fi
            sleep 1
          done
          pnpm run test:cases:required
          pnpm run test:cases:evidence
          pnpm run test:pdf-worker-smoke > test-results/m4-pdf-worker-smoke.log 2>&1
          cat test-results/m4-pdf-worker-smoke.log
      - name: Run the real API, database, queue, Worker, and PDF Worker smoke
        run: |
          set -a
          source infra/local-stack.env
          set +a
          export OTR_RUNTIME_SMOKE_DATABASE_URL="$DATABASE_URL"
          export OTR_RUNTIME_SMOKE_REDIS_URL="$REDIS_URL"
          export OTR_RUNTIME_SMOKE_STORAGE_ENDPOINT="$S3_ENDPOINT"
          export OTR_RUNTIME_SMOKE_CLAMAV_PORT="$CLAMAV_PORT"
          pnpm run test:runtime-smoke
      - name: Upload required-case result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m0-m4-required-case-evidence
          path: |
            test-results/
            apps/web/test-results/
          if-no-files-found: error
      - name: Stop integration dependencies
        if: always()
        run: bash scripts/dev-down.sh --track compose
      - name: Verify tests did not change tracked sources
        run: git diff --exit-code
