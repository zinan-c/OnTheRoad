name: All Test Cases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    name: all-tests / development
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and Linux test tools
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick poppler-utils
      - name: Run every development test case
        run: pnpm run test:all:dev
      - name: Verify tests did not change tracked sources
        run: git diff --exit-code

  compose:
    name: all-tests / A02 Compose integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Compose bootstrap and health cases
        env:
          RUN_COMPOSE_INTEGRATION: "1"
        run: >-
          pnpm exec vitest run
          tests/infra/bootstrap.e2e.spec.mjs
          tests/infra/compose-health.spec.mjs
          --maxWorkers=1
      - name: Run Compose persistence and fail-closed cases
        env:
          RUN_COMPOSE_INTEGRATION: "1"
        run: >-
          pnpm exec vitest run
          tests/infra/compose-recovery.spec.mjs
          --maxWorkers=1
      - name: Remove Compose services and volumes
        if: always()
        run: |
          if [[ -f infra/local-stack.env ]]; then
            docker compose \
              --env-file infra/local-stack.env \
              -f infra/compose/docker-compose.yml \
              down --volumes --remove-orphans
          fi
