name: "CI: Test Cases"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cases:
    name: "CI: Test Cases"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned native MinIO test tools
        run: |
          bash scripts/install-native-minio.sh "$RUNNER_TEMP/otr-native-minio"
          echo "$RUNNER_TEMP/otr-native-minio" >> "$GITHUB_PATH"
      - name: Install Chromium and Linux test tools
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick poppler-utils
      - name: Run every development test case
        run: pnpm run test:all:dev
      - name: Verify tests did not change tracked sources
        run: git diff --exit-code
