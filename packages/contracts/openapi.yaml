  "components": {
    "parameters": {
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 255
        }
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "ExampleId": {
        "name": "exampleId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "TripId": {
        "name": "tripId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "TripDayId": {
        "name": "tripDayId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "ItineraryItemId": {
        "name": "itemId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "LocationId": {
        "name": "locationId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "AttachmentId": {
        "name": "attachmentId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "JobId": {
        "name": "jobId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      }
    },
    "headers": {
      "ETag": {
        "description": "Opaque resource version used with If-Match.",
        "schema": {
          "type": "string"
        }
      },
      "SessionCookie": {
        "description": "Hardened HttpOnly, Secure, SameSite session cookie.",
        "schema": {
          "type": "string"
        }
      }
    },
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-otr_session",
        "description": "Owner identity is derived exclusively from the authenticated session; clients cannot submit ownerId."
      }
    },
    "responses": {
      "Problem": {
        "description": "RFC 9457 style error",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetails"
            }
          }
        }
      }
    },
    "schemas": {
      "ResourceId": {
        "type": "string",
        "format": "uuid"
      },
      "LocalDate": {
        "type": "string",
        "format": "date",
        "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
      },
      "UtcDateTime": {
        "type": "string",
        "format": "date-time"
      },
      "ExampleResource": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "date"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "date": {
            "$ref": "#/components/schemas/LocalDate"
          }
        }
      },
      "MapProfile": {
        "type": "string",
        "enum": [
          "cn_primary",
          "international_primary",
          "hybrid"
        ]
      },
      "TripStatus": {
        "type": "string",
        "enum": [
          "draft",
          "active",
          "archived",
          "deleted"
        ]
      },
      "DestinationInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "countryCode": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "city": {
            "type": "string",
            "maxLength": 160
          },
          "region": {
            "type": "string",
            "maxLength": 160
          }
        }
      },
      "Destination": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "countryCode",
          "city",
          "region",
          "sortOrder",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "countryCode": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[A-Z]{2}$"
          },
          "city": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 160
          },
          "region": {
            "type": [
              "string",
