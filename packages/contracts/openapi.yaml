{
  "openapi": "3.1.0",
  "info": {
    "title": "On The Road API",
    "version": "1.0.0",
    "description": "Versioned REST contract for On The Road."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "paths": {
    "/example": {
      "get": {
        "operationId": "getExample",
        "summary": "Contract smoke endpoint",
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          }
        ],
        "responses": {
          "200": {
            "description": "Example resource",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExampleResource"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      },
      "post": {
        "operationId": "createExample",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "responses": {
          "201": {
            "description": "Created example",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExampleResource"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/example/{exampleId}": {
      "get": {
        "operationId": "getExampleById",
        "parameters": [
          {
            "$ref": "#/components/parameters/ExampleId"
          }
        ],
        "responses": {
          "200": {
            "description": "Example resource",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExampleResource"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/system/reference-data": {
      "get": {
        "operationId": "getReferenceData",
        "summary": "List immutable currency, cost category, and transport mode reference data",
        "responses": {
          "200": {
            "description": "Central reference data",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReferenceData"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/trips": {
      "get": {
        "operationId": "listTrips",
        "summary": "List owner-scoped trips",
        "parameters": [
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "search",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 160
            }
          },
          {
            "name": "currency",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[A-Z]{3}$"
            }
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/TripStatus"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Owner-scoped trip page",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TripPage"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      },
      "post": {
        "operationId": "createTrip",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TripInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created trip",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Trip"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/trips/{tripId}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/TripId"
        }
      ],
      "get": {
        "operationId": "getTrip",
        "responses": {
          "200": {
            "description": "Owner-scoped trip",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Trip"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      },
      "patch": {
        "operationId": "updateTrip",
        "parameters": [
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TripPatch"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated trip",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Trip"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      },
      "delete": {
        "operationId": "deleteTrip",
        "parameters": [
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "responses": {
          "200": {
            "description": "Soft-deleted trip",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Trip"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/trips/{tripId}/restore": {
      "post": {
        "operationId": "restoreTrip",
        "parameters": [
          {
            "$ref": "#/components/parameters/TripId"
          },
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "responses": {
          "200": {
            "description": "Restored trip",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Trip"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/trips/{tripId}/days/{tripDayId}/itinerary-items": {
      "parameters": [
        {
          "$ref": "#/components/parameters/TripId"
        },
        {
          "$ref": "#/components/parameters/TripDayId"
        }
      ],
      "get": {
        "operationId": "listItineraryItems",
        "responses": {
          "200": {
            "description": "Visible itinerary items ordered within the day",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/ItineraryItem"
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      },
      "post": {
        "operationId": "createItineraryItem",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ItineraryItemInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created itinerary item",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ItineraryItem"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/trips/{tripId}/itinerary-items/{itemId}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/TripId"
        },
        {
          "$ref": "#/components/parameters/ItineraryItemId"
        }
      ],
      "get": {
        "operationId": "getItineraryItem",
        "responses": {
          "200": {
            "description": "Owner-scoped itinerary item",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ItineraryItem"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      },
      "patch": {
        "operationId": "updateItineraryItem",
        "parameters": [
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ItineraryItemPatch"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated itinerary item",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ItineraryItem"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      },
      "delete": {
        "operationId": "deleteItineraryItem",
        "parameters": [
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "responses": {
          "200": {
            "description": "Soft-deleted itinerary item",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ItineraryItem"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/trips/{tripId}/itinerary-items/{itemId}/copy": {
      "post": {
        "operationId": "copyItineraryItem",
        "parameters": [
          {
            "$ref": "#/components/parameters/TripId"
          },
          {
            "$ref": "#/components/parameters/ItineraryItemId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "targetTripDayId"
                ],
                "properties": {
                  "targetTripDayId": {
                    "$ref": "#/components/schemas/ResourceId"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Copied itinerary item",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ItineraryItem"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 255
        }
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "ExampleId": {
        "name": "exampleId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "TripId": {
        "name": "tripId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "TripDayId": {
        "name": "tripDayId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "ItineraryItemId": {
        "name": "itemId",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      }
    },
    "headers": {
      "ETag": {
        "description": "Opaque resource version used with If-Match.",
        "schema": {
          "type": "string"
        }
      }
    },
    "responses": {
      "Problem": {
        "description": "RFC 9457 style error",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetails"
            }
          }
        }
      }
    },
    "schemas": {
      "ResourceId": {
        "type": "string",
        "format": "uuid"
      },
      "LocalDate": {
        "type": "string",
        "format": "date",
        "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
      },
      "UtcDateTime": {
        "type": "string",
        "format": "date-time"
      },
      "ExampleResource": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "date"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "date": {
            "$ref": "#/components/schemas/LocalDate"
          }
        }
      },
      "MapProfile": {
        "type": "string",
        "enum": [
          "cn_primary",
          "international_primary",
          "hybrid"
        ]
      },
      "TripStatus": {
        "type": "string",
        "enum": [
          "draft",
          "active",
          "archived",
          "deleted"
        ]
      },
      "DestinationInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "countryCode": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "city": {
            "type": "string",
            "maxLength": 160
          },
          "region": {
            "type": "string",
            "maxLength": 160
          }
        }
      },
      "Destination": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "countryCode",
          "city",
          "region",
          "sortOrder",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "countryCode": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[A-Z]{2}$"
          },
          "city": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 160
          },
          "region": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 160
          },
          "sortOrder": {
            "type": "integer",
            "minimum": 0
          },
          "createdAt": {
            "$ref": "#/components/schemas/UtcDateTime"
          },
          "updatedAt": {
            "$ref": "#/components/schemas/UtcDateTime"
          }
        }
      },
      "TripInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "startDate",
          "endDate",
          "travelers",
          "defaultCurrency",
          "timezone",
          "mapProfile",
          "destinations"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "startDate": {
            "$ref": "#/components/schemas/LocalDate"
          },
          "endDate": {
            "$ref": "#/components/schemas/LocalDate"
          },
          "travelers": {
            "type": "integer",
            "minimum": 1,
            "maximum": 999
          },
          "defaultCurrency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "budget": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^(0|[1-9]\\d{0,15})(\\.\\d{2})$"
          },
          "timezone": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "mapProfile": {
            "$ref": "#/components/schemas/MapProfile"
          },
          "description": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 5000
          },
          "destinations": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/DestinationInput"
            }
          }
        }
      },
      "TripPatch": {
        "type": "object",
        "additionalProperties": false,
        "minProperties": 1,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "startDate": {
            "$ref": "#/components/schemas/LocalDate"
          },
          "endDate": {
            "$ref": "#/components/schemas/LocalDate"
          },
          "travelers": {
            "type": "integer",
            "minimum": 1,
            "maximum": 999
          },
          "defaultCurrency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "budget": {
            "type": [
              "string",
              "null"
            ]
          },
          "timezone": {
            "type": "string"
          },
          "mapProfile": {
            "$ref": "#/components/schemas/MapProfile"
          },
          "description": {
            "type": [
              "string",
              "null"
            ]
          },
          "destinations": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/DestinationInput"
            }
          }
        }
      },
      "Trip": {
        "allOf": [
          {
            "$ref": "#/components/schemas/TripInput"
          },
          {
            "type": "object",
            "required": [
              "id",
              "ownerId",
              "totalDays",
              "status",
              "version",
              "createdAt",
              "updatedAt",
              "deletedAt"
            ],
            "properties": {
              "id": {
                "$ref": "#/components/schemas/ResourceId"
              },
              "ownerId": {
                "type": "string",
                "minLength": 1
              },
              "totalDays": {
                "type": "integer",
                "minimum": 1
              },
              "destinations": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/Destination"
                }
              },
              "status": {
                "$ref": "#/components/schemas/TripStatus"
              },
              "version": {
                "type": "integer",
                "minimum": 1
              },
              "createdAt": {
                "$ref": "#/components/schemas/UtcDateTime"
              },
              "updatedAt": {
                "$ref": "#/components/schemas/UtcDateTime"
              },
              "deletedAt": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/UtcDateTime"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            }
          }
        ]
      },
      "TripPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Trip"
            }
          },
          "nextCursor": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "ItineraryItemType": {
        "type": "string",
        "enum": [
          "activity",
          "attraction",
          "dining",
          "hotel",
          "transport",
          "other"
        ]
      },
      "ItineraryTimeKind": {
        "type": "string",
        "enum": [
          "clock",
          "range",
          "period",
          "unscheduled"
        ]
      },
      "SensitiveItineraryValue": {
        "oneOf": [
          {
            "type": "string",
            "maxLength": 10000
          },
          {
            "type": "object",
            "additionalProperties": true
          },
          {
            "type": "null"
          }
        ]
      },
      "DiningItemInput": {
        "type": [
          "object",
          "null"
        ],
        "additionalProperties": false,
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          },
          "mealType": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "breakfast",
              "lunch",
              "dinner",
              "snack",
              "other",
              null
            ]
          },
          "details": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 5000
          },
          "locationId": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ResourceId"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "AccommodationInput": {
        "type": [
          "object",
          "null"
        ],
        "additionalProperties": false,
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          },
          "details": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 5000
          },
          "locationId": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ResourceId"
              },
              {
                "type": "null"
              }
            ]
          },
          "checkInAt": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/UtcDateTime"
              },
              {
                "type": "null"
              }
            ]
          },
          "checkOutAt": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/UtcDateTime"
              },
              {
                "type": "null"
              }
            ]
          },
          "bookingInfo": {
            "$ref": "#/components/schemas/SensitiveItineraryValue"
          },
          "contactInfo": {
            "$ref": "#/components/schemas/SensitiveItineraryValue"
          }
        }
      },
      "ItineraryItemInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
