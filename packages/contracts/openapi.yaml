                "type": "string",
                "minLength": 1
              },
              "sortOrder": {
                "type": "integer",
                "minimum": 0
              },
              "version": {
                "type": "integer",
                "minimum": 1
              },
              "createdAt": {
                "$ref": "#/components/schemas/UtcDateTime"
              },
              "updatedAt": {
                "$ref": "#/components/schemas/UtcDateTime"
              },
              "deletedAt": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/UtcDateTime"
