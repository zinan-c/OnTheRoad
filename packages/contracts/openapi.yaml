          "failedUnits": { "type": "integer", "minimum": 0 },
          "cancelledUnits": { "type": "integer", "minimum": 0 },
          "cancelRequestedAt": { "type": ["string", "null"], "format": "date-time" },
          "createdAt": { "$ref": "#/components/schemas/UtcDateTime" },
          "updatedAt": { "$ref": "#/components/schemas/UtcDateTime" },
          "completedAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "Wgs84Point": {
        "type": "object",
        "additionalProperties": false,
        "required": ["longitude", "latitude", "crs"],
        "properties": {
          "longitude": { "type": "number", "minimum": -180, "maximum": 180 },
          "latitude": { "type": "number", "minimum": -90, "maximum": 90 },
          "crs": { "type": "string", "const": "WGS84" }
        }
      },
      "UnresolvedImportLocation": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "tripId", "importJobId", "importRowId", "sourceRowKey", "status", "version", "inputText", "candidates", "selectedPoint", "selectedType", "errors"],
        "properties": {
          "id": { "$ref": "#/components/schemas/ResourceId" },
          "tripId": { "$ref": "#/components/schemas/ResourceId" },
          "importJobId": { "$ref": "#/components/schemas/ResourceId" },
          "importRowId": { "$ref": "#/components/schemas/ResourceId" },
          "sourceRowKey": { "type": "string" },
          "status": { "type": "string", "enum": ["staged", "ready"] },
          "version": { "type": "integer", "minimum": 1 },
          "inputText": { "type": "string", "minLength": 1 },
          "candidates": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": ["label", "formattedAddress", "point", "provider", "attribution", "candidateToken"],
              "properties": {
                "label": { "type": "string" },
                "formattedAddress": { "type": "string" },
                "point": { "$ref": "#/components/schemas/Wgs84Point" },
                "countryCode": { "type": ["string", "null"] },
                "city": { "type": ["string", "null"] },
                "district": { "type": ["string", "null"] },
                "confidence": { "type": ["number", "null"] },
                "provider": { "type": "string" },
                "attribution": { "type": "string" },
                "candidateToken": { "type": "string" }
              }
            }
          },
          "selectedPoint": { "anyOf": [{ "$ref": "#/components/schemas/Wgs84Point" }, { "type": "null" }] },
          "selectedType": { "type": ["string", "null"], "enum": ["candidate", "map_point", "manual_coordinate", "accept_text", null] },
          "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
        }
      },
      "UnresolvedLocationDecisionInput": {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["type", "candidateToken"],
            "properties": { "type": { "const": "candidate" }, "candidateToken": { "type": "string", "minLength": 1 } }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["type", "point"],
            "properties": { "type": { "enum": ["map_point", "manual_coordinate"] }, "point": { "$ref": "#/components/schemas/Wgs84Point" }, "name": { "type": "string", "maxLength": 500 } }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["type"],
            "properties": { "type": { "const": "accept_text" }, "name": { "type": "string", "maxLength": 500 } }
          }
        ]
      },
      "StagedLocationDecisionResult": {
        "type": "object",
        "additionalProperties": true,
        "required": ["id", "importJobId", "importRowId", "stagingId", "decisionType", "status", "version", "stagedLocation"],
        "properties": {
          "id": { "$ref": "#/components/schemas/ResourceId" },
          "importJobId": { "$ref": "#/components/schemas/ResourceId" },
          "importRowId": { "$ref": "#/components/schemas/ResourceId" },
          "stagingId": { "$ref": "#/components/schemas/ResourceId" },
          "decisionType": { "type": "string", "enum": ["candidate", "map_point", "manual_coordinate", "accept_text"] },
          "status": { "const": "ready" },
          "version": { "type": "integer", "minimum": 1 },
          "stagedLocation": { "type": "object", "additionalProperties": true }
        }
      },
      "ImportOverrideInput": {
        "type": "object",
        "additionalProperties": false,
        "required": ["reason"],
        "properties": { "reason": { "type": "string", "minLength": 1, "maxLength": 2000 } }
      },
      "ImportOverrideDecision": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "importJobId", "importRowId", "decisionType", "reason", "actorId"],
        "properties": {
          "id": { "$ref": "#/components/schemas/ResourceId" },
          "importJobId": { "$ref": "#/components/schemas/ResourceId" },
          "importRowId": { "$ref": "#/components/schemas/ResourceId" },
          "decisionType": { "type": "string", "enum": ["duplicate_insert"] },
          "reason": { "type": "string" },
          "actorId": { "type": "string" },
          "consumedAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "ImportMediaDecisionInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": { "reason": { "type": "string", "maxLength": 2000 } }
      },
      "ImportMediaTask": {
        "type": "object",
        "additionalProperties": true,
        "required": ["id", "tripId", "importJobId", "importRowId", "sourceRowKey", "urlOrdinal", "sourceUrlSha256", "status", "attemptCount", "lifetimeAttemptCount", "retryGeneration"],
        "properties": {
          "id": { "$ref": "#/components/schemas/ResourceId" },
          "tripId": { "$ref": "#/components/schemas/ResourceId" },
          "importJobId": { "$ref": "#/components/schemas/ResourceId" },
          "importRowId": { "$ref": "#/components/schemas/ResourceId" },
          "sourceRowKey": { "type": "string" },
          "itineraryItemId": { "type": ["string", "null"], "format": "uuid" },
          "attachmentId": { "type": ["string", "null"], "format": "uuid" },
          "urlOrdinal": { "type": "integer", "minimum": 0 },
          "sourceUrlSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "status": { "type": "string" },
          "decisionBy": { "type": ["string", "null"] },
          "decidedAt": { "type": ["string", "null"], "format": "date-time" },
          "attemptCount": { "type": "integer", "minimum": 0 },
          "lifetimeAttemptCount": { "type": "integer", "minimum": 0 },
          "retryGeneration": { "type": "integer", "minimum": 0 },
          "nextAttemptAt": { "type": ["string", "null"], "format": "date-time" },
          "errorCode": { "type": ["string", "null"] },
          "errorDetail": { "type": ["string", "null"] },
          "createdAt": { "$ref": "#/components/schemas/UtcDateTime" },
          "updatedAt": { "$ref": "#/components/schemas/UtcDateTime" },
          "completedAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "CapabilityMatrix": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "geocoding",
          "reverseGeocoding",
          "directions",
          "staticMaps",
          "imports",
          "exports"
        ],
        "properties": {
          "geocoding": {
            "type": "boolean"
          },
          "reverseGeocoding": {
            "type": "boolean"
          },
          "directions": {
            "type": "boolean"
          },
          "staticMaps": {
            "type": "boolean"
          },
          "imports": {
            "type": "boolean"
          },
          "exports": {
            "type": "boolean"
          }
        }
      },
      "FieldError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "field",
          "message"
        ],
        "properties": {
          "field": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "ProblemDetails": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status",
          "code",
          "traceId",
          "errors"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "code": {
            "type": "string",
            "pattern": "^[A-Z][A-Z0-9_]*$"
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string"
          },
          "traceId": {
            "type": "string",
            "minLength": 1
          },
          "errors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FieldError"
            }
          }
        }
      }
    }
  }
}
