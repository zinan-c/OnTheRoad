        "anyOf": [
          {
            "required": [
              "target"
            ]
          },
          {
            "required": [
              "description"
            ]
          }
        ],
        "properties": {
          "tripDayId": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "itemType": {
            "$ref": "#/components/schemas/ItineraryItemType"
          },
          "timeKind": {
            "$ref": "#/components/schemas/ItineraryTimeKind"
          },
          "startTime": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$"
          },
          "endTime": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$"
          },
          "endDayOffset": {
            "type": "integer",
            "enum": [
              0,
              1
            ],
            "default": 0
          },
          "timeZone": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 255
          },
          "timePeriod": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "early_morning",
              "morning",
              "noon",
              "afternoon",
              "evening",
              "night",
              "late_night",
              null
            ]
          },
          "target": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          },
          "description": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 10000
          },
          "durationMinutes": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "maximum": 525600
          },
          "destinationId": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ResourceId"
              },
              {
                "type": "null"
              }
            ]
          },
          "locationId": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ResourceId"
              },
              {
                "type": "null"
              }
            ]
          },
          "startLocationId": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ResourceId"
              },
              {
                "type": "null"
              }
            ]
          },
          "endLocationId": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ResourceId"
              },
              {
                "type": "null"
              }
            ]
          },
          "transportModeCode": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 100
          },
          "bookingInfo": {
            "$ref": "#/components/schemas/SensitiveItineraryValue"
          },
          "contactInfo": {
            "$ref": "#/components/schemas/SensitiveItineraryValue"
          },
          "remark": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 10000
          },
          "externalSource": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 255
          },
          "externalId": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          },
          "dining": {
            "$ref": "#/components/schemas/DiningItemInput"
          },
          "accommodation": {
            "$ref": "#/components/schemas/AccommodationInput"
          }
        }
      },
      "ItineraryItemPatch": {
        "type": "object",
        "minProperties": 1,
        "additionalProperties": true,
        "description": "Partial canonical ItineraryItemInput; tripDayId is immutable."
      },
      "ItineraryItem": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ItineraryItemInput"
          },
          {
            "type": "object",
            "required": [
              "id",
              "tripId",
              "ownerId",
              "sortOrder",
              "version",
              "createdAt",
              "updatedAt",
              "deletedAt"
            ],
            "properties": {
              "id": {
                "$ref": "#/components/schemas/ResourceId"
              },
